<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="tisabur — a small open-source corner of the universe.">
  <meta name="theme-color" content="#080a2a">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="tisabur">
  <meta property="og:locale" content="en_US">
  <meta property="og:title" content="tisabur — Open-source collaboration">
  <meta property="og:description" content="A small open-source corner of the universe.">
  <meta property="og:url" content="https://22g.de/">
  <meta property="og:image" content="https://22g.de/social-preview.png">
  <meta property="og:image:secure_url" content="https://22g.de/social-preview.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1280">
  <meta property="og:image:height" content="640">
  <meta property="og:image:alt" content="A luminous rainbow crystal with a spiral galaxy core and a rocket trail.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="tisabur — Open-source collaboration">
  <meta name="twitter:description" content="A small open-source corner of the universe.">
  <meta name="twitter:image" content="https://22g.de/social-preview.png">
  <meta name="twitter:image:alt" content="A luminous rainbow crystal with a spiral galaxy core and a rocket trail.">
  <link rel="canonical" href="https://22g.de/">
  <title>tisabur — Open-source collaboration</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f7f5ff;
      --muted: #c9c5e8;
      --panel: rgba(10, 12, 45, .68);
      --line: rgba(255, 255, 255, .16);
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 18% 14%, rgba(0, 218, 255, .22), transparent 28rem),
        radial-gradient(circle at 84% 72%, rgba(255, 0, 194, .19), transparent 30rem),
        linear-gradient(135deg, #050719 0%, #0b1040 48%, #190a32 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: -45%;
      pointer-events: none;
      opacity: .25;
      background: repeating-radial-gradient(ellipse at center, transparent 0 9rem, rgba(123, 105, 255, .13) 9.1rem 9.25rem, transparent 9.35rem 15rem);
      transform: rotate(-18deg);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .2;
      background-image: radial-gradient(circle, rgba(255, 255, 255, .75) 0 1px, transparent 1.5px);
      background-size: 137px 113px;
      mask-image: linear-gradient(to bottom, black, transparent 88%);
    }

    .shell {
      position: relative;
      width: min(1160px, calc(100% - 32px));
      padding: clamp(1.25rem, 4vw, 3.75rem) 0;
    }

    .intro {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 2rem;
      margin: 0 auto 1.25rem;
      padding: 0 .25rem;
    }

    .eyebrow {
      margin: 0 0 .6rem;
      color: #9deeff;
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.8rem, 9vw, 6.7rem);
      line-height: .9;
      letter-spacing: -.075em;
      font-weight: 800;
      background: linear-gradient(100deg, #fff 6%, #b7f5ff 34%, #ffb4f1 72%, #ffe7a2 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 1.2rem rgba(109, 231, 255, .2));
    }

    .note {
      max-width: 20rem;
      margin: 0 0 .35rem;
      color: var(--muted);
      font-size: clamp(.95rem, 1.5vw, 1.08rem);
      line-height: 1.5;
      text-align: right;
    }

    .preview-frame {
      position: relative;
      padding: clamp(.5rem, 1.4vw, 1rem);
      border: 1px solid var(--line);
      border-radius: clamp(1.1rem, 2.3vw, 1.8rem);
      background: linear-gradient(135deg, rgba(255, 255, 255, .12), rgba(255, 255, 255, .025));
      box-shadow: 0 2rem 6rem rgba(0, 0, 0, .35), 0 0 4rem rgba(69, 111, 255, .16);
      backdrop-filter: blur(16px);
    }

    .preview-frame::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 12% 16%;
      border-radius: 50%;
      background: linear-gradient(90deg, rgba(0, 228, 255, .25), rgba(255, 0, 196, .22));
      filter: blur(4rem);
    }

    .preview-frame img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: calc(clamp(1.1rem, 2.3vw, 1.8rem) - .45rem);
      box-shadow: 0 .8rem 2.5rem rgba(0, 0, 0, .3);
    }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      margin: 1rem .25rem 0;
      color: rgba(237, 235, 255, .58);
      font-size: .82rem;
    }

    a {
      color: #d5f8ff;
      text-underline-offset: .22em;
    }

    a:hover { color: #fff; }

    @media (max-width: 650px) {
      .intro { display: block; }
      .note { margin-top: 1rem; text-align: left; }
      footer { display: block; line-height: 1.8; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="intro">
      <div>
        <p class="eyebrow">tisabur.github.io</p>
        <h1>tisabur</h1>
      </div>
      <p class="note">A small open-source corner of the universe.</p>
    </header>

    <figure class="preview-frame">
      <img src="social-preview.png" alt="A luminous rainbow crystal with a spiral galaxy core and a rocket trail.">
    </figure>

    <footer>
      <span>💎 🌈 🌀 🚀</span>
      <a href="https://github.com/tisabur">github.com/tisabur</a>
    </footer>
  </main>
</body>
</html>
